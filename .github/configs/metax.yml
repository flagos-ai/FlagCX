# MetaX Hardware Configuration
hardware_name: metax
display_name: MetaX Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/metax.yml
  - .github/scripts/set_env/metax.sh
  - .github/scripts/ci/run_metax_workload.sh
  - .github/scripts/ci/check_metax_devices.py
  - .github/scripts/ci/check_metax_torch_results.py
  - docker/metax-ci/**
  - flagcx/adaptor/device/maca_adaptor.cc
  - test/kernel/maca/**/*
  - flagcx/adaptor/ccl/mccl_adaptor.cc
  - flagcx/adaptor/include/metax_adaptor.h
  - flagcx/adaptor/tuner/mccl_tuner.cc

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx-metax-maca3.8.1.3:2.3.0@sha256:e9b511953d3e8675b1e8d215b7d2f4777a5d7898bd2cee9e7e58a6663c56e575

runner_labels:
  - mx-k8s-cicd-flagcx

# ARC creates the job Pod from ci_image. Device access and Pod settings are
# provided by the Kubernetes runner configuration.
job_container: true

set_env: .github/scripts/set_env/metax.sh

unit_test_suites:
  - adaptor
  - core
  - p2p
  - rma
  - runner
  - service
  - symmem
