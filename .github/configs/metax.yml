# MetaX Hardware Configuration
hardware_name: metax
display_name: MetaX Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/metax.yml
  - .github/scripts/set_env/metax.sh
  - .github/scripts/ci/run_metax_workload.sh
  - .github/scripts/ci/check_metax_devices.py
  - flagcx/adaptor/device/maca_adaptor.cc
  - makefiles/metax.mk
  - flagcx/adaptor/kernel/metax/**/*
  - flagcx/adaptor/include/device_api/metax_*.h
  - bindings/ir/metax/**/*
  - test/kernel/maca/**/*
  - flagcx/adaptor/ccl/mccl_adaptor.cc
  - flagcx/adaptor/include/metax_adaptor.h
  - flagcx/adaptor/tuner/mccl_tuner.cc

# TODO(metax-torch): Provide a CI image with working mcPyTorch before enabling Torch API jobs.
ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:3016346-metax-dev

runner_labels:
  - mx-8g-cicd-flagcx

docker_volumes:
  - /opt/mxdriver:/opt/mxdriver:ro

docker_options:
  - --network=host
  - --hostname=te-cicd
  - --ipc=host
  - --privileged=true
  - --shm-size=500g
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --ulimit=nofile=65535:65535
  - --group-add=video
  - --env=PLATFORM=metax
  - --env=TORCH_DISTRIBUTED_BACKEND=mccl

set_env: .github/scripts/set_env/metax.sh

unit_test_suites:
  - adaptor
  - core
  - device_api
  - device_api_host
  - device_api_unified_ir
  - p2p
  - rdma_atomic_probe
  - rma
  - runner
  - service
  - symmem

# Platform exclusions; every entry must document its reason.
ignore_test:
  gtest:
  - suite: adaptor
    tests:
    - DeviceAdaptorTest.StreamWaitWriteValue64
    - DeviceAdaptorTest.StreamWaitValue64RemoteFlushCapability
    reason: 'Temporary: the current MACA SDK rejects native stream memops on finegrained allocations required by Device API IPC'
  - suite: rma
    tests:
    - RmaTest.IpcGetSameStreamCompletion
    reason: 'Temporary: the same-stream gate uses native stream memops, which reject finegrained allocations in the current MACA SDK'
  perf:
    operations:
    - allreduce
    - reducescatter
    modes:
    - homogeneous
    reason: MetaX AllReduce and ReduceScatter fail FP32 SUM data verification at 128 MiB; pending diagnosis
