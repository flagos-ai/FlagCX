# Iluvatar CoreX hardware configuration
hardware_name: iluvatar
display_name: Iluvatar CoreX Tests

# Only platform-specific files belong here; shared or unmatched changes run all.
paths_watch:
  - .github/configs/iluvatar.yml
  - .github/scripts/set_env/iluvatar.sh
  - docker/iluvatar-ci/**
  - flagcx/adaptor/device/ixcuda_adaptor.cc
  - flagcx/adaptor/ccl/ixnccl_adaptor.cc
  - flagcx/adaptor/include/iluvatar_adaptor.h
  - flagcx/adaptor/include/device_api/iluvatar_*
  - flagcx/adaptor/kernel/iluvatar/*
  - makefiles/iluvatar.mk
  - test/kernel/iluvatar/*

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:Iluvatar-dev-fixed-20261019

runner_labels:
  - ts-8g-cicd-flagcx

docker_volumes:
  - /dev:/dev
  - /lib/modules:/lib/modules
  - /usr/local/corex-4.5.0/lib64/libcuda.so.1:/usr/local/corex/lib64/libcuda.so.1
  - /usr/local/corex-4.5.0/lib64/libixml.so:/usr/local/corex/lib64/libixml.so
  - /sys/class/infiniband:/sys/class/infiniband:ro
  - /sys/class/infiniband_verbs:/sys/class/infiniband_verbs:ro

docker_options:
  - --network=host
  - --hostname=flagcx-iluvatar
  - --ipc=host
  - --privileged
  - --shm-size=500g
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --ulimit=nofile=65535:65535
  - --env=COREX_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
  - --env=CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7

set_env: .github/scripts/set_env/iluvatar.sh

unit_test_suites:
  - adaptor
  - core
  - device_api
  - device_api_host
  - device_api_unified_ir
  - p2p
  - rma
  - runner
  - service
  - symmem
