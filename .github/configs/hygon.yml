# Hygon DCU Hardware Configuration
hardware_name: hygon
display_name: Hygon DCU Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/hygon.yml
  - .github/scripts/set_env/hygon.sh
  - .github/scripts/ci/run_hygon_workload.sh
  - .github/scripts/ci/run_hygon_experimental_perf.sh
  - flagcx/adaptor/device/duhip_adaptor.cc
  - flagcx/adaptor/ccl/durccl_adaptor.cc
  - flagcx/adaptor/kernel/du/**/*
  - flagcx/adaptor/kernel/common/**/*
  - test/kernel/du/**/*
  - flagcx/adaptor/include/du_adaptor.h
  - flagcx/adaptor/include/device_api/du_*.h

# Use the fixed image tag rather than b079886-hygon-dev. The rebake pushed under
# that tag on 2026-09-11 removed the hcoll package, but Open MPI still depends
# on libhcoll.so.1, causing MPI links to fail. Revisit this tag when the image
# contains a working HCOLL or an Open MPI build without that dependency.
ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:hygon-dev-fixed-20260912

runner_labels:
  - hg-8g-cicd-flagcx

docker_volumes:
  - /usr/local/hyhal:/opt/hyhal:ro
  # The SHCA provider uses this host directory and control node when opening
  # the HCA from inside the explicitly managed CI container.
  - /var/log/shca:/var/log/shca

docker_options:
  - --network=host
  - --ipc=host
  - --privileged=true
  - --shm-size=100gb
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --ulimit=nofile=65535:65535
  - --device=/dev/kfd
  - --device=/dev/dri
  - --device=/dev/shca-ioctl
  - --mount=type=bind,src=/dev/infiniband,dst=/dev/infiniband
  - --mount=type=bind,src=/sys/class/infiniband,dst=/sys/class/infiniband,readonly
  - --mount=type=bind,src=/sys/class/infiniband_verbs,dst=/sys/class/infiniband_verbs,readonly
  - --group-add=video
  - --env=PLATFORM=hygon
  - --env=FLAGCX_ADAPTOR=du
set_env: .github/scripts/set_env/hygon.sh

unit_test_suites:
  - adaptor
  - core
  - device_api
  - device_api_host
  - device_api_unified_ir
  - p2p
  - rma
  - runner
  - service
  - symmem
