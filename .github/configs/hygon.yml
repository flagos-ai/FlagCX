# Hygon DCU Hardware Configuration
hardware_name: hygon
display_name: Hygon DCU Tests

# Pinned by digest, not by the b079886-hygon-dev tag: the rebake pushed under that
# tag on 2026-09-11 runs an MLX->SHCA conversion that removes the hcoll package,
# while the Open MPI in the image still has libhcoll.so.1 in libmpi.so's DT_NEEDED
# and RUNPATH. Every MPI link then fails on undefined hcoll symbols. Drop the pin
# when the image carries a working HCOLL (or an Open MPI rebuilt without it) again.
ci_image: harbor.baai.ac.cn/flagos-dev/flagcx@sha256:00db17623d118e5c9c7788799c67c36a430d4d43550fc0f42476001e353a4140

runner_labels:
  - hg-8g-cicd-flagcx

docker_volumes:
  - /usr/local/hyhal:/opt/hyhal:ro
  # The SHCA provider uses this host directory and control node when opening
  # the HCA from inside the explicitly managed CI container.
  - /var/log/shca:/var/log/shca

docker_options:
  - --network=host
  - --ipc=host
  - --privileged=true
  - --shm-size=100gb
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --device=/dev/kfd
  - --device=/dev/dri
  - --device=/dev/shca-ioctl
  - --mount=type=bind,src=/dev/infiniband,dst=/dev/infiniband
  - --mount=type=bind,src=/sys/class/infiniband,dst=/sys/class/infiniband,readonly
  - --mount=type=bind,src=/sys/class/infiniband_verbs,dst=/sys/class/infiniband_verbs,readonly
  - --group-add=video
  - --env=PLATFORM=hygon
  - --env=FLAGCX_ADAPTOR=du
set_env: .github/scripts/set_env/hygon.sh

unit_test_suites:
  - adaptor
  - core
  - p2p
  - rma
  - runner
  - service
  - symmem
