# KunlunXin hardware configuration
hardware_name: kunlunxin
display_name: KunlunXin Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/kunlunxin.yml
  - .github/scripts/set_env/kunlunxin.sh
  - .github/docker/Dockerfile.kunlunxin-ci
  - makefiles/kunlunxin.mk
  - flagcx/adaptor/device/kunlunxin_adaptor.cc
  - flagcx/adaptor/kernel/kunlunxin/**/*
  - flagcx/adaptor/include/kunlunxin_adaptor.h
  - flagcx/adaptor/include/device_api/kunlunxin_*.h
  - test/kernel/klx/**/*

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx-kunlunxin-xre5.37.1:2.3.0

runner_labels:
  - kl-8g-cicd-flagcx

# Use the XRE and CUDA compatibility libraries shipped in ci_image. Mounting
# /usr/local/xpu from the runner replaces them with the host's XRE version.
docker_volumes: []

# Job containers keep the Actions bridge for checkout/artifact actions. Hardware
# workloads enter this network namespace while retaining the image filesystem.
job_container_volumes:
  - /proc:/run/flagcx-host-proc:ro

docker_options:
  - --network=host
  - --ipc=host
  - --privileged=true
  - --shm-size=64G
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --ulimit=nofile=65535:65535
  - --group-add=video
  - --env=PLATFORM=kunlunxin
  - --env=MPI_HOME=/usr/local/openmpi
  - --env=CCL_HOME=/usr/local/xccl_Linux_x86_64
  - --env=DEVICE_HOME=/opt/flagcx-sdk/xre
  - --env=LD_LIBRARY_PATH=/usr/local/openmpi/lib:/usr/local/xccl_Linux_x86_64/so:/opt/flagcx-sdk/xre/so:/opt/flagcx-sdk/xre/lib:/usr/local/xcudart/lib
  - --device=/dev/xpuctrl
  - --device=/dev/xpu0
  - --device=/dev/xpu1
  - --device=/dev/xpu2
  - --device=/dev/xpu3
  - --device=/dev/xpu4
  - --device=/dev/xpu5
  - --device=/dev/xpu6
  - --device=/dev/xpu7

set_env: .github/scripts/set_env/kunlunxin.sh

# Device adaptor coverage lives in adaptor; topology coverage lives in core.
# KunlunXin's Device API coverage uses the unified IR targets.
unit_test_suites:
  - adaptor
  - core
  - device_api_host
  - device_api_unified_ir
  - kernel
  - p2p
  - rma
  - runner
  - service
  - symmem

ignore_test:
  gtest:
    - suite: kernel
      tests:
        - DevicePtrArgs.DevCommFreeDevicePtrNull
        - DevicePtrArgs.DevMemFreeDevicePtrNull
      reason: XSHMEM returns success for null-handle release; current API tests expect flagcxInvalidArgument
    - suite: adaptor
      tests:
        - IpcMemHandleMpiTest.*Gdr*
      reason: KunlunXin GDR allocation fails at cuPointerSetAttribute(SYNC_MEMOPS)
    - suite: p2p
      tests:
        - FlagcxP2pEngineReadTest.ReadsWholeRegisteredGpuBufferAfterMetadataHandshake
        - FlagcxP2pEngineReadTest.TwoIndependent2KiBReadsCover4KiBBuffer
        - FlagcxP2pEngineReadTest.RejectsOutOfBoundsReadBeforeSubmission
        - FlagcxP2pEngineReadTest.RejectsInvalidRegistrationAndDescriptorRanges
        - FlagcxP2pEngineReadTest.AcceptsZeroLengthDescriptorAtRegistrationEnd
        - FlagcxP2pEngineReadTest.RejectsOutOfBoundsWriteBeforeSubmission
        - FlagcxP2pEngineReadTest.ReadsRetargetedRemoteGpuSubrangeIntoLocalWindow
      reason: These cases require GDR allocation with SYNC_MEMOPS, unavailable in the current XRE
    - suite: adaptor
      tests:
        - DeviceAdaptorTest.GetManagedPointerType
      reason: XRE does not support managed allocation
  phases:
    - suite: perf
      name: heterogeneous
      reason: XRE cudaLaunchHostFunc is unsupported
    - suite: p2p
      name: p2p-write-mpi
      reason: GDR allocation fails at cuPointerSetAttribute(SYNC_MEMOPS)
    - suite: rma
      name: rma-mpi
      reason: GDR allocation fails at cuPointerSetAttribute(SYNC_MEMOPS)
    - suite: symmem
      name: symmem-mpi
      reason: GDR allocation fails at cuPointerSetAttribute(SYNC_MEMOPS)
    - suite: runner
      name: runner-mpi
      reason: XRE rejects cudaHostAlloc(Mapped, 4 MiB)
    - suite: device_api_unified_ir
      name: inter-and-forced-net
      reason: XSHMEM supports intra-node communication only
    - suite: rma
      name: gdr-visibility
      reason: No validated KunlunXin XPU consumer route for GDR visibility
    - suite: symmem
      name: vmm-local-and-remote-without-net
      reason: No validated KunlunXin VMM MR data route
    - suite: symmem
      name: vmm-net-data
      reason: No validated KunlunXin VMM MR data route
    - suite: torch-api
      name: heterogeneous
      reason: XRE cudaLaunchHostFunc is unsupported
  perf:
    operations:
      - gather
    modes:
      - homogeneous
      - heterogeneous
    reason: XCCL Gather adaptor returns flagcxNotSupported
  torch:
    operations:
      - gather
    modes:
      - homogeneous
      - heterogeneous
    reason: Gather is unsupported and heterogeneous collectives require unsupported cudaLaunchHostFunc
