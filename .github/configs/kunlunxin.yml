# KunlunXin hardware configuration
hardware_name: kunlunxin
display_name: KunlunXin Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/kunlunxin.yml
  - .github/scripts/set_env/kunlunxin.sh
  - Dockerfile.kunlunxin-ci
  - makefiles/kunlunxin.mk
  - flagcx/adaptor/device/kunlunxin_adaptor.cc
  - flagcx/adaptor/kernel/kunlunxin/**/*
  - flagcx/adaptor/include/kunlunxin_adaptor.h
  - flagcx/adaptor/include/device_api/kunlunxin_*.h
  - test/kernel/klx/**/*

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:kunlunxin-dev-fixed-20261019

runner_labels:
  - kl-8g-cicd-flagcx

docker_volumes:
  - /usr/local/xpu:/usr/local/xpu:ro

docker_options:
  - --network=host
  - --ipc=host
  - --privileged=true
  - --shm-size=500g
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --ulimit=nofile=65535:65535
  - --group-add=video
  - --env=PLATFORM=kunlunxin
  - --env=MPI_HOME=/usr/local/mpich-3.3.2
  - --env=CCL_HOME=/usr/local/xccl_Linux_x86_64
  - --env=DEVICE_HOME=/usr/local/xpu
  - --env=LD_LIBRARY_PATH=/usr/local/xccl_Linux_x86_64/so:/usr/local/mpich-3.3.2/lib:/usr/local/xpu/so:/usr/local/xpu/lib
  - --device=/dev/xpuctrl
  - --device=/dev/xpu0
  - --device=/dev/xpu1
  - --device=/dev/xpu2
  - --device=/dev/xpu3
  - --device=/dev/xpu4
  - --device=/dev/xpu5
  - --device=/dev/xpu6
  - --device=/dev/xpu7

set_env: .github/scripts/set_env/kunlunxin.sh

unit_test_suites:
  - adaptor
  - core
  - device
  - device_api
  - device_api_host
  - device_api_unified_ir
  - kernel
  - p2p
  - rma
  - runner
  - service
  - symmem
  - topo
