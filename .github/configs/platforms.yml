# Unit-test platform registry.
#
# The per-platform files keep detailed runner/image settings. This registry
# controls which platforms are included when the workflow runs with
# platform=all.
platforms:
  cuda:
    # Temporarily focus pull-request unit-test coverage on MetaX.
    enabled: false
  hygon:
    # Temporarily focus pull-request unit-test coverage on MetaX.
    enabled: false
  metax:
    enabled: true
