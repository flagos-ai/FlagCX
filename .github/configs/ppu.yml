# T-Head PPU hardware configuration
hardware_name: ppu
display_name: T-Head PPU Tests

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:manual-20260827-ppu-dev

runner_labels:
  - flagcicd-810e

docker_volumes: []

docker_options:
  - --network=host
  - --ipc=host
  - --privileged=true
  - --shm-size=100gb
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --device=/dev/alixpu
  - --device=/dev/alixpu_ctl
  - --device=/dev/alixpu_ppu0
  - --device=/dev/alixpu_ppu1
  - --device=/dev/alixpu_ppu2
  - --device=/dev/alixpu_ppu3
  - --device=/dev/alixpu_ppu4
  - --device=/dev/alixpu_ppu5
  - --device=/dev/alixpu_ppu6
  - --device=/dev/alixpu_ppu7
  - --device=/dev/alixpu_ppu8
  - --device=/dev/alixpu_ppu9
  - --device=/dev/alixpu_ppu10
  - --device=/dev/alixpu_ppu11
  - --device=/dev/alixpu_ppu12
  - --device=/dev/alixpu_ppu13
  - --device=/dev/alixpu_ppu14
  - --device=/dev/alixpu_ppu15
  - --mount=type=bind,src=/dev/infiniband,dst=/dev/infiniband
  - --mount=type=bind,src=/sys/class/infiniband,dst=/sys/class/infiniband,readonly
  - --mount=type=bind,src=/sys/class/infiniband_verbs,dst=/sys/class/infiniband_verbs,readonly

set_env: .github/scripts/set_env/ppu.sh

# PPU validates both P2P and RMA through ACCL. Device-kernel suites remain
# excluded until their PPU support is available in CI.
unit_test_suites:
  - adaptor
  - core
  - p2p
  - rma
  - runner
  - service
  - symmem
