# T-Head PPU hardware configuration
hardware_name: ppu
display_name: T-Head PPU Tests

# Only platform-specific files belong here; shared/unmatched changes run all.
paths_watch:
  - .github/configs/ppu.yml
  - .github/scripts/set_env/ppu.sh
  - .github/scripts/ci/run_ppu_workload.sh
  - .github/scripts/ci/run_ppu_perf_experimental.sh
  - flagcx/adaptor/device/ptpu_adaptor.cc
  - flagcx/adaptor/device/hggc_adaptor.cc
  - flagcx/adaptor/ccl/ppu_pccl_adaptor.cc
  - flagcx/adaptor/include/ppu_adaptor.h
  - flagcx/adaptor/include/device_api/ppu_*.h
  - flagcx/adaptor/kernel/ppu/**/*
  - test/kernel/ppu/**/*
  - tools/probe_hggc_sdk.py
  - flagcx/adaptor/include/barex_runtime.h
  - flagcx/adaptor/net/barex_adaptor.cc
  - makefiles/ppu.mk

ci_image: harbor.baai.ac.cn/flagos-dev/flagcx:manual-20260827-ppu-dev

runner_labels:
  - flagcicd-810e

docker_volumes: []

docker_options:
  - --network=host
  - --shm-size=100gb
  - --ulimit=memlock=-1
  - --ulimit=stack=67108864
  - --device=/dev/alixpu
  - --device=/dev/alixpu_ctl
  - --device=/dev/alixpu_ppu0
  - --device=/dev/alixpu_ppu1
  - --device=/dev/alixpu_ppu2
  - --device=/dev/alixpu_ppu3
  - --device=/dev/alixpu_ppu4
  - --device=/dev/alixpu_ppu5
  - --device=/dev/alixpu_ppu6
  - --device=/dev/alixpu_ppu7
  - --device=/dev/alixpu_ppu8
  - --device=/dev/alixpu_ppu9
  - --device=/dev/alixpu_ppu10
  - --device=/dev/alixpu_ppu11
  - --device=/dev/alixpu_ppu12
  - --device=/dev/alixpu_ppu13
  - --device=/dev/alixpu_ppu14
  - --device=/dev/alixpu_ppu15
  - --device=/dev/infiniband/rdma_cm
  - --device=/dev/infiniband/uverbs0
  - --device=/dev/infiniband/uverbs1
  - --device=/dev/infiniband/uverbs2
  - --device=/dev/infiniband/uverbs3
  - --device=/dev/infiniband/fic2_soe_ucmd0
  - --device=/dev/infiniband/fic2_soe_ucmd1
  - --device=/dev/infiniband/fic2_soe_ucmd2
  - --device=/dev/infiniband/fic2_soe_ucmd3

set_env: .github/scripts/set_env/ppu.sh

# PPU validates Device API through the common DefaultBackend and native HGGC
# kernels, in addition to the ACCL P2P/RMA suites.
unit_test_suites:
  - adaptor
  - core
  - device_api
  - device_api_host
  - device_api_unified_ir
  - p2p
  - rma
  - runner
  - service
  - symmem

# Platform exclusions; every entry must document its reason.
ignore_test:
  gtest:
  - suite: runner
    tests:
    - FlagCXCollTest.FinalizeThenRankLocalDestroy
    reason: PCCL native Destroy can wait for peer Destroy after native Finalize; restore
      when SDK local teardown is supported
  - suite: p2p
    tests:
    - P2pAdaptorStruct.*
    - P2pAdaptorTest.*
    - P2pLoopbackTest.*
    - P2pEngineRpcTransportTest.ConnectAcceptIsLocalSameHost
    reason: These tests directly target the IBRC vtable; PPU CI validates the BAREX transport through
      P2P Engine tests
  phases:
  - suite: p2p
    name: p2p-legacy-unit
    reason: Legacy ACCL P2P unit tests can hang in BAREX process-exit statistics cleanup; shared-engine
      unit and WRITE MPI coverage remains enabled
  - suite: symmem
    name: vmm-net-data
    reason: PPU BAREX has no validated VMM-capable MR route
