# Changed paths select unit-test suites; unmatched paths run all suites.
shared_paths_watch:
  - flagcx/core/**
  - flagcx/adaptor/flagcx_device.cc
  - flagcx/include/**
  - include/**
  - Makefile
  - make.inc
  - test/make.inc
  - makefiles/**
  - .github/workflows/**
  - .github/scripts/ci/**
scheduling:
  unit:
    kind: unit
    resource_class: single-gpu
    gpu_count: 1
    allowed_windows: [day, night]
    long_running_after_minutes: 20
    timeout_policy: historical_p95_plus_grace
    grace_minutes: 10
    hard_timeout_minutes: 120
  performance:
    kind: end-to-end
    resource_class: multi-gpu
    gpu_count: 2
    allowed_windows: [night]
    long_running_after_minutes: 60
    timeout_policy: historical_p95_plus_grace
    grace_minutes: 15
    hard_timeout_minutes: 240
  torch_api:
    kind: end-to-end
    resource_class: multi-gpu
    gpu_count: 2
    allowed_windows: [night]
    long_running_after_minutes: 60
    timeout_policy: historical_p95_plus_grace
    grace_minutes: 15
    hard_timeout_minutes: 180
suites:
  adaptor: [flagcx/adaptor/**]
  core: [test/unittest/core/**, flagcx/core/**]
  device_api: [test/unittest/device_api/**, flagcx/adaptor/kernel/**]
  device_api_host: [test/unittest/device_api/**]
  device_api_unified_ir: [test/unittest/device_api/**, flagcx/adaptor/kernel/**]
  device_traits: [test/unittest/device_traits/**]
  p2p: [test/unittest/p2p/**, test/kernel/p2p/**, flagcx/**/p2p/**]
  rma: [test/unittest/rma/**, test/kernel/rma/**, flagcx/**/rma/**]
  runner: [test/unittest/runner/**, test/kernel/runner/**]
  service: [test/unittest/service/**]
  symmem: [test/unittest/symmem/**, test/script/symmem_test.sh]
