name: Build Debian Packages

# Verifies that the packaging definition still builds and installs. It is
# not a release path: packages published to the FlagOS repositories are
# built and uploaded by flagos-ai/build-infra from a pinned ref, so no tag
# triggers a build here.
on:
  pull_request:
    branches: [ main ]
    # Only what changes the package. flagcx/** is the library source, so
    # leaving it here built a full multi-backend matrix for every source PR;
    # those packages are published nowhere and downloaded by no one. A build
    # can be requested by hand.
    paths:
      - 'packaging/debian/**'
      - 'packaging/sync-changelog.py'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

jobs:
  build-packages:
    env:
      FLAGCX_CI_CHECKOUT_PATH: .ci-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-build-packages-${{ matrix.backend }}
      FLAGCX_CI_SOURCE_ROOT: ${{ github.workspace }}/.ci-checkouts/${{ github.run_id }}-${{ github.run_attempt }}-build-packages-${{ matrix.backend }}
      FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs/${{ github.run_id }}-${{ github.run_attempt }}-build-packages-${{ matrix.backend }}
    runs-on: h20

    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metax]

    steps:
      - name: Prepare isolated checkout and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          mkdir -p "$FLAGCX_CI_SOURCE_ROOT" "$FLAGCX_CI_LOG_DIR"
          {
            printf 'job=%s run=%s attempt=%s runner=%s\n' "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME"
            printf 'source=%s\nlogs=%s\n' "$FLAGCX_CI_SOURCE_ROOT" "$FLAGCX_CI_LOG_DIR"
            git --version || true
          } > "$FLAGCX_CI_LOG_DIR/checkout.log" 2>&1

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          path: ${{ env.FLAGCX_CI_CHECKOUT_PATH }}
          submodules: false

      - name: Checkout submodules with retries
        id: submodules
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="${FLAGCX_CI_SOURCE_ROOT:-$GITHUB_WORKSPACE}"
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/ci/checkout_submodules.sh 2>&1 | tee -a "$FLAGCX_CI_LOG_DIR/checkout.log"

      - name: Record checkout outcome
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SUBMODULE_OUTCOME: ${{ steps.submodules.outcome }}
        run: |
          printf 'checkout=%s submodules=%s\n' "$CHECKOUT_OUTCOME" "$SUBMODULE_OUTCOME" >> "$FLAGCX_CI_LOG_DIR/checkout.log"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=harbor.baai.ac.cn/flagos-dev/flagcx/buildkit:buildx-stable-1

      - name: Build ${{ matrix.backend }} packages
        id: workload
        run: |
          export GITHUB_WORKSPACE="${FLAGCX_CI_SOURCE_ROOT:-$GITHUB_WORKSPACE}"
          cd "$GITHUB_WORKSPACE"
          ./packaging/debian/build-helpers/build-flagcx.sh ${{ matrix.backend }}

      - name: Upload ${{ matrix.backend }} packages
        uses: actions/upload-artifact@v7
        with:
          name: flagcx-${{ matrix.backend }}-packages
          path: ${{ env.FLAGCX_CI_SOURCE_ROOT }}/debian-packages/${{ matrix.backend }}/*.deb
          retention-days: 1

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkout-build-deb-${{ github.run_attempt }}-${{ matrix.backend }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
