name: Build Debian Packages

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    # Only what changes the package. flagcx/** is the library source, so
    # leaving it here built a full multi-backend matrix for every source PR;
    # those packages are published nowhere and downloaded by no one. Release
    # tags above still build, and a build can be requested by hand.
    paths:
      - 'packaging/debian/**'
      - 'packaging/sync-changelog.py'
      - '.github/workflows/build-deb.yml'
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: h20

    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metax]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=harbor.baai.ac.cn/flagos-dev/flagcx/buildkit:buildx-stable-1

      - name: Build ${{ matrix.backend }} packages
        run: ./packaging/debian/build-helpers/build-flagcx.sh ${{ matrix.backend }}

      - name: Upload ${{ matrix.backend }} packages
        uses: actions/upload-artifact@v7
        with:
          name: flagcx-${{ matrix.backend }}-packages
          path: debian-packages/${{ matrix.backend }}/*.deb
          retention-days: 1
