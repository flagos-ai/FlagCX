name: FlagCX CI

on:
  push:
    branches:
      - main
      - devops
  pull_request:
    branches: [main, devops]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform name, all, or comma-separated names"
        required: true
        type: string
        default: all
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: flagcx-ci-${{ github.event_name == 'issue_comment' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve platform matrix
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/test'))
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.resolve.outputs.active }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      has_platforms: ${{ steps.resolve.outputs.has_platforms }}
      repository: ${{ steps.resolve.outputs.repository }}
      ref: ${{ steps.resolve.outputs.ref }}
      probe_only: ${{ steps.resolve.outputs.probe_only }}
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Checkout CI configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve changed paths, labels, and authorization
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SELECTION: ${{ inputs.platform || 'all' }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          context_file="$RUNNER_TEMP/flagcx-ci-context.json"
          files_file="$RUNNER_TEMP/flagcx-ci-files.txt"
          : > "$files_file"
          labels='[]'
          comment=''
          permission=none
          is_pull_request=false
          repository="$EVENT_REPOSITORY"
          ref="$EVENT_SHA"
          head_branch="${GITHUB_REF_NAME:-}"
          selection="$EVENT_SELECTION"

          case "$EVENT_NAME" in
            pull_request)
              pr=$(jq -c '.pull_request' "$EVENT_PATH")
              number=$(jq -r '.number' "$EVENT_PATH")
              labels=$(jq -c '[.pull_request.labels[].name]' "$EVENT_PATH")
              gh api --paginate "repos/$EVENT_REPOSITORY/pulls/$number/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)' > "$files_file"
              repository=$(jq -r '.head.repo.full_name // empty' <<< "$pr")
              ref=$(jq -r '.head.sha' <<< "$pr")
              head_branch=$(jq -r '.head.ref' <<< "$pr")
              is_pull_request=true
              ;;
            issue_comment)
              comment=$(jq -r '.comment.body // ""' "$EVENT_PATH")
              if jq -e '.issue.pull_request' "$EVENT_PATH" >/dev/null; then
                number=$(jq -r '.issue.number' "$EVENT_PATH")
                pr=$(gh api "repos/$EVENT_REPOSITORY/pulls/$number")
                labels=$(jq -c '[.labels[].name]' <<< "$pr")
                gh api --paginate "repos/$EVENT_REPOSITORY/pulls/$number/files?per_page=100" \
                  --jq '.[] | .filename, (.previous_filename // empty)' > "$files_file"
                repository=$(jq -r '.head.repo.full_name // empty' <<< "$pr")
                ref=$(jq -r '.head.sha' <<< "$pr")
                head_branch=$(jq -r '.head.ref' <<< "$pr")
                permission=$(gh api "repos/$EVENT_REPOSITORY/collaborators/$ACTOR/permission" \
                  --jq '.permission' 2>/dev/null || printf 'none')
                is_pull_request=true
              fi
              ;;
            push)
              ;;
            schedule)
              ;;
            workflow_dispatch)
              ;;
          esac

          if [[ "$head_branch" == ascend-symmem &&
                ( "$EVENT_NAME" == pull_request || "$EVENT_NAME" == push || "$EVENT_NAME" == schedule ) ]]; then
            echo 'probe_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'probe_only=false' >> "$GITHUB_OUTPUT"
          fi

          files_json=$(jq -Rsc 'split("\n") | map(select(length > 0))' "$files_file")
          jq -n \
            --arg event_name "$EVENT_NAME" \
            --argjson labels "$labels" \
            --argjson files "$files_json" \
            --arg permission "$permission" \
            --arg comment "$comment" \
            --argjson is_pull_request "$is_pull_request" \
            --arg selection "$selection" \
            --arg repository "$repository" \
            --arg ref "$ref" \
            '{event_name:$event_name, labels:$labels, files:$files, permission:$permission,
              comment:$comment, is_pull_request:$is_pull_request, selection:$selection,
              repository:$repository, ref:$ref}' > "$context_file"

          ruby .github/scripts/ci/resolve_ci_matrix.rb \
            .github/configs "$context_file"

  unit_tests:
    name: Platform unit tests
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.has_platforms == 'true' && needs.prepare.outputs.probe_only != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: ${{ matrix.platform }}
      repository: ${{ needs.prepare.outputs.repository }}
      ref: ${{ needs.prepare.outputs.ref }}

  performance_tests:
    name: Platform performance tests
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.probe_only != 'true'
    uses: ./.github/workflows/test.yml
    with:
      platforms: ${{ needs.prepare.outputs.platforms }}
      repository: ${{ needs.prepare.outputs.repository }}
      ref: ${{ needs.prepare.outputs.ref }}

  torch_api_tests:
    name: Platform Torch API tests
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.probe_only != 'true'
    uses: ./.github/workflows/torch-api-test.yml
    with:
      platforms: ${{ needs.prepare.outputs.platforms }}
      repository: ${{ needs.prepare.outputs.repository }}
      ref: ${{ needs.prepare.outputs.ref }}
    secrets:
      FLAGCICD_API_TOKEN: ${{ needs.prepare.outputs.repository == github.repository && secrets.FLAGCICD_API_TOKEN || '' }}

  format-check:
    name: Common checks
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.probe_only != 'true'
    uses: ./.github/workflows/format-check.yml
    with:
      repository: ${{ needs.prepare.outputs.repository }}
      ref: ${{ needs.prepare.outputs.ref }}

  load_ascend_probe_config:
    name: Load Ascend probe configuration
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.probe_only == 'true'
    runs-on: ubuntu-latest
    outputs:
      ci_image: ${{ steps.config.outputs.ci_image }}
      docker_args: ${{ steps.config.outputs.docker_args }}
      set_env: ${{ steps.config.outputs.set_env }}
      runs_on: ${{ steps.config.outputs.runs_on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Load Ascend configuration
        id: config
        run: ruby .github/scripts/ci/load_platform_config.rb ascend

  ascend_probe:
    name: Ascend independent probes
    needs: [prepare, load_ascend_probe_config]
    if: needs.prepare.outputs.active == 'true' && needs.load_ascend_probe_config.result == 'success'
    runs-on: ${{ fromJSON(needs.load_ascend_probe_config.outputs.runs_on) }}
    timeout-minutes: 120
    env:
      FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run Ascend probes in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-probe-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load_ascend_probe_config.outputs.docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load_ascend_probe_config.outputs.ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load_ascend_probe_config.outputs.set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ascend probe

      - name: Cleanup Ascend probe container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-ascend-probe-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  ci_complete:
    name: ci-complete
    if: always() && (github.event_name != 'issue_comment' || needs.prepare.outputs.active == 'true')
    needs: [prepare, unit_tests, performance_tests, torch_api_tests, format-check, ascend_probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify required CI results
        env:
          ACTIVE: ${{ needs.prepare.outputs.active }}
          HAS_PLATFORMS: ${{ needs.prepare.outputs.has_platforms }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          PERF_RESULT: ${{ needs.performance_tests.result }}
          TORCH_RESULT: ${{ needs.torch_api_tests.result }}
          FORMAT_RESULT: ${{ needs.format-check.result }}
          PROBE_ONLY: ${{ needs.prepare.outputs.probe_only }}
          PROBE_RESULT: ${{ needs.ascend_probe.result }}
        shell: bash
        run: |
          if [[ "$PROBE_ONLY" == true && "$ACTIVE" == true ]]; then
            if [[ "$PREPARE_RESULT" != success || "$PROBE_RESULT" != success ]]; then
              echo "Ascend probe CI failed: prepare=$PREPARE_RESULT probe=$PROBE_RESULT" >&2
              exit 1
            fi
            echo "Ascend probe CI collected its diagnostic report; inspect the probe summary."
          else
            bash .github/scripts/ci/check_ci_results.sh \
              "$ACTIVE" "$HAS_PLATFORMS" "$PREPARE_RESULT" "$UNIT_RESULT" \
              "$PERF_RESULT" "$TORCH_RESULT" "$FORMAT_RESULT"
          fi
