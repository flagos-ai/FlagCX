name: Common Platform Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        description: Platform configuration name
        required: true
        type: string

jobs:
  checkout_and_config:
    name: Load platform configuration
    runs-on: ubuntu-latest
    outputs:
      display_name: ${{ steps.config.outputs.display_name }}
      ci_image: ${{ steps.config.outputs.ci_image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      container_volumes: ${{ steps.config.outputs.container_volumes }}
      container_options: ${{ steps.config.outputs.container_options }}
      set_env: ${{ steps.config.outputs.set_env }}
      unit_test_suites: ${{ steps.config.outputs.unit_test_suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Load platform configuration
        id: config
        env:
          FLAGCX_CI_PLATFORM: ${{ inputs.platform }}
        run: ruby .github/scripts/ci/load_platform_config.rb "$FLAGCX_CI_PLATFORM"

  unit_tests:
    name: Unit tests
    needs: checkout_and_config
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: ${{ inputs.platform }}
      display_name: ${{ needs.checkout_and_config.outputs.display_name }}
      runs_on: ${{ needs.checkout_and_config.outputs.runs_on }}
      image: ${{ needs.checkout_and_config.outputs.ci_image }}
      container_volumes: ${{ needs.checkout_and_config.outputs.container_volumes }}
      container_options: ${{ needs.checkout_and_config.outputs.container_options }}
      set_env: ${{ needs.checkout_and_config.outputs.set_env }}
      suites: ${{ needs.checkout_and_config.outputs.unit_test_suites }}
