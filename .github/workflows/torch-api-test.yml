name: Torch API Tests in Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  load-hardware-container-configs:
    name: Load platform container configurations
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 658
    runs-on: ubuntu-latest
    outputs:
      cuda_ci_image: ${{ steps.cuda.outputs.ci_image }}
      cuda_docker_args: ${{ steps.cuda.outputs.docker_args }}
      cuda_set_env: ${{ steps.cuda.outputs.set_env }}
      cuda_runs_on: ${{ steps.cuda.outputs.runs_on }}
      metax_ci_image: ${{ steps.metax.outputs.ci_image }}
      metax_docker_args: ${{ steps.metax.outputs.docker_args }}
      metax_set_env: ${{ steps.metax.outputs.set_env }}
      metax_runs_on: ${{ steps.metax.outputs.runs_on }}
      hygon_ci_image: ${{ steps.hygon.outputs.ci_image }}
      hygon_docker_args: ${{ steps.hygon.outputs.docker_args }}
      hygon_set_env: ${{ steps.hygon.outputs.set_env }}
      hygon_runs_on: ${{ steps.hygon.outputs.runs_on }}
      ppu_ci_image: ${{ steps.ppu.outputs.ci_image }}
      ppu_docker_args: ${{ steps.ppu.outputs.docker_args }}
      ppu_set_env: ${{ steps.ppu.outputs.set_env }}
      ppu_runs_on: ${{ steps.ppu.outputs.runs_on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Load CUDA configuration
        id: cuda
        run: ruby .github/scripts/ci/load_platform_config.rb cuda

      - name: Load MetaX configuration
        id: metax
        run: ruby .github/scripts/ci/load_platform_config.rb metax

      - name: Load Hygon configuration
        id: hygon
        run: ruby .github/scripts/ci/load_platform_config.rb hygon

      - name: Load PPU configuration
        id: ppu
        run: ruby .github/scripts/ci/load_platform_config.rb ppu

  torch-api-test-hygon:
    name: torch-api-test (hygon)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.hygon_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (hygon) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.hygon_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.hygon_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.hygon_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          hygon torch-api

      - name: Cleanup torch-api-test (hygon) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

  torch-api-test-cuda:
    name: torch-api-test (cuda)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.cuda_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (cuda) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.cuda_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.cuda_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.cuda_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          cuda torch-api

      - name: Cleanup torch-api-test (cuda) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

  torch-api-test-metax:
    name: torch-api-test (metax)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.metax_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (metax) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.metax_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.metax_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.metax_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          metax torch-api

      - name: Cleanup torch-api-test (metax) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

  torch-api-test-ppu:
    name: torch-api-test (ppu)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.ppu_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (ppu) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ppu_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ppu_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ppu_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ppu torch-api

      - name: Cleanup torch-api-test (ppu) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
