name: Torch API Tests in Container

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      FLAGCICD_API_TOKEN:
        required: false

env:
  FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
  FLAGCX_CI_TEST_TIMEOUT: 80m
  FLAGCX_CI_MPI_TIMEOUT: 80m

jobs:
  load-hardware-container-configs:
    if: inputs.platforms != '[]'
    name: Load platform container configurations
    runs-on: ubuntu-latest
    outputs:
      cuda_ci_image: ${{ steps.cuda.outputs.ci_image }}
      cuda_docker_args: ${{ steps.cuda.outputs.docker_args }}
      cuda_set_env: ${{ steps.cuda.outputs.set_env }}
      cuda_runs_on: ${{ steps.cuda.outputs.runs_on }}
      metax_ci_image: ${{ steps.metax.outputs.ci_image }}
      metax_docker_args: ${{ steps.metax.outputs.docker_args }}
      metax_set_env: ${{ steps.metax.outputs.set_env }}
      metax_runs_on: ${{ steps.metax.outputs.runs_on }}
      hygon_ci_image: ${{ steps.hygon.outputs.ci_image }}
      hygon_docker_args: ${{ steps.hygon.outputs.docker_args }}
      hygon_set_env: ${{ steps.hygon.outputs.set_env }}
      hygon_runs_on: ${{ steps.hygon.outputs.runs_on }}
      ppu_ci_image: ${{ steps.ppu.outputs.ci_image }}
      ppu_docker_args: ${{ steps.ppu.outputs.docker_args }}
      ppu_set_env: ${{ steps.ppu.outputs.set_env }}
      ppu_runs_on: ${{ steps.ppu.outputs.runs_on }}
      kunlunxin_ci_image: ${{ steps.kunlunxin.outputs.ci_image }}
      kunlunxin_docker_args: ${{ steps.kunlunxin.outputs.docker_args }}
      kunlunxin_set_env: ${{ steps.kunlunxin.outputs.set_env }}
      kunlunxin_runs_on: ${{ steps.kunlunxin.outputs.runs_on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Load CUDA configuration
        id: cuda
        run: ruby .github/scripts/ci/load_platform_config.rb cuda

      - name: Load MetaX configuration
        id: metax
        run: ruby .github/scripts/ci/load_platform_config.rb metax

      - name: Load Hygon configuration
        id: hygon
        run: ruby .github/scripts/ci/load_platform_config.rb hygon

      - name: Load PPU configuration
        id: ppu
        run: ruby .github/scripts/ci/load_platform_config.rb ppu

      - name: Load KunlunXin configuration
        id: kunlunxin
        run: ruby .github/scripts/ci/load_platform_config.rb kunlunxin

  torch-api-test-hygon:
    if: contains(fromJSON(inputs.platforms), 'hygon')
    name: torch-api-test (hygon)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.hygon_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (hygon) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.hygon_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.hygon_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.hygon_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          hygon torch-api

      - name: Cleanup torch-api-test (hygon) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-torch-api-test-hygon-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  torch-api-test-cuda:
    if: contains(fromJSON(inputs.platforms), 'cuda')
    name: torch-api-test (cuda)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.cuda_runs_on) }}
    timeout-minutes: 180
    env:
      FLAGCICD_TOKEN_SET: ${{ secrets.FLAGCICD_API_TOKEN != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (cuda) in configured container
        shell: bash
        env:
          FLAGCX_CI_TORCH_COVERAGE: '1'
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.cuda_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.cuda_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.cuda_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          cuda torch-api

      - name: Cleanup torch-api-test (cuda) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Collect Python coverage report
        if: ${{ !cancelled() && hashFiles('.ci-logs/coverage-cuda-gpu-torch.json') != '' }}
        run: cp "$FLAGCX_CI_LOG_DIR/coverage-cuda-gpu-torch.json" coverage-cuda-gpu-torch.json

      - name: Upload coverage report to FlagCICD
        if: ${{ !cancelled() && env.FLAGCICD_TOKEN_SET == 'true' && hashFiles('coverage-cuda-gpu-torch.json') != '' }}
        uses: flagos-ai/FlagOps/actions/post-pytest-report@5bd0e138a6ae482b1a1cc809ea6705ecfd6eb410
        continue-on-error: true
        timeout-minutes: 2
        with:
          backend_url: https://flagcicd.flagos.net/flagcicd/api/v1/cicd/metrics/
          api_token: ${{ secrets.FLAGCICD_API_TOKEN }}
          report_path: coverage-cuda-gpu-torch.json
          file_type: coverage
          job_name: coverage-cuda-gpu-torch
          pr_id: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          fail_on_error: 'false'

      - name: Archive Python coverage report
        if: ${{ !cancelled() && hashFiles('coverage-cuda-gpu-torch.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cuda-gpu-torch
          path: coverage-cuda-gpu-torch.json
          retention-days: 7

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-torch-api-test-cuda-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  torch-api-test-metax:
    if: contains(fromJSON(inputs.platforms), 'metax')
    name: torch-api-test (metax)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.metax_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (metax) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.metax_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.metax_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.metax_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          metax torch-api

      - name: Cleanup torch-api-test (metax) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-torch-api-test-metax-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  torch-api-test-ppu:
    if: contains(fromJSON(inputs.platforms), 'ppu')
    name: torch-api-test (ppu)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.ppu_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (ppu) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ppu_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ppu_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ppu_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ppu torch-api

      - name: Cleanup torch-api-test (ppu) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-torch-api-test-ppu-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  torch-api-test-kunlunxin:
    if: contains(fromJSON(inputs.platforms), 'kunlunxin')
    name: torch-api-test (kunlunxin)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.kunlunxin_runs_on) }}
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run torch-api-test (kunlunxin) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-kunlunxin-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          kunlunxin torch-api

      - name: Cleanup torch-api-test (kunlunxin) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-kunlunxin-torch_api-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-torch-api-test-kunlunxin-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  torch_api_complete:
    name: Validate selected Torch API jobs
    if: always()
    needs:
      - load-hardware-container-configs
      - torch-api-test-hygon
      - torch-api-test-cuda
      - torch-api-test-metax
      - torch-api-test-ppu
      - torch-api-test-kunlunxin
    runs-on: ubuntu-latest
    env:
      PLATFORMS: ${{ inputs.platforms }}
      CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
      CUDA_BASE_RESULT: ${{ needs['torch-api-test-cuda'].result }}
      CUDA_RESULT: ${{ needs['torch-api-test-cuda'].result }}
      HYGON_RESULT: ${{ needs['torch-api-test-hygon'].result }}
      METAX_RESULT: ${{ needs['torch-api-test-metax'].result }}
      PPU_RESULT: ${{ needs['torch-api-test-ppu'].result }}
      KUNLUNXIN_RESULT: ${{ needs['torch-api-test-kunlunxin'].result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate selected Torch API jobs
        run: >-
          bash .github/scripts/ci/check_platform_workflow.sh
          "$PLATFORMS" "$CONFIG_RESULT" "$CUDA_BASE_RESULT" "$CUDA_RESULT"
          "$HYGON_RESULT" "$METAX_RESULT" "$PPU_RESULT"

      - name: Validate selected KunlunXin Torch API job
        env:
          PLATFORMS: ${{ inputs.platforms }}
          CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
          KUNLUNXIN_RESULT: ${{ needs['torch-api-test-kunlunxin'].result }}
        shell: bash
        run: |
          if python3 -c 'import json, os, sys; sys.exit(0 if "kunlunxin" in json.loads(os.environ["PLATFORMS"]) else 1)'; then
            [[ "$CONFIG_RESULT" == success ]] || { echo "KunlunXin configuration loading ended with: $CONFIG_RESULT" >&2; exit 1; }
            [[ "$KUNLUNXIN_RESULT" == success ]] || { echo "KunlunXin Torch API job ended with: $KUNLUNXIN_RESULT" >&2; exit 1; }
          fi
