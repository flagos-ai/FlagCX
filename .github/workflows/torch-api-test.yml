name: Torch API Tests in Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  load-hardware-container-configs:
    name: Load explicit container configurations
    runs-on: ubuntu-latest
    outputs:
      hygon_ci_image: ${{ steps.hygon.outputs.ci_image }}
      hygon_docker_args: ${{ steps.hygon.outputs.docker_args }}
      hygon_set_env: ${{ steps.hygon.outputs.set_env }}
      ppu_ci_image: ${{ steps.ppu.outputs.ci_image }}
      ppu_docker_args: ${{ steps.ppu.outputs.docker_args }}
      ppu_set_env: ${{ steps.ppu.outputs.set_env }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Load Hygon configuration
        id: hygon
        run: ruby .github/scripts/ci/load_platform_config.rb hygon

      - name: Load PPU configuration
        id: ppu
        run: ruby .github/scripts/ci/load_platform_config.rb ppu

  torch-api-test:
    runs-on: [self-hosted, cx-build]
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.0-time2507111538
      options:  --gpus all --shm-size=500g --privileged --ipc=host --ulimit memlock=-1 --ulimit stack=67108864 --ulimit nofile=65535:65535 --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/googletest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/json"
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Set up Install Dependencies
        run: |
          export PATH=/root/miniconda3/bin:$PATH
          eval "$(/root/miniconda3/bin/conda shell.bash hook)" && conda activate flagscale-train && conda env list
          apt update -y && apt-get install -y git rdma-core ibverbs-utils perftest infiniband-diags libibverbs-dev librdmacm-dev
          pip list | grep torch && which python
          cd /__w/FlagCX/FlagCX
          git config --global --add safe.directory /__w/FlagCX/FlagCX && git status

      - name: Run `make` to build the project
        run: |
          cd /__w/FlagCX/FlagCX
          export MPI_HOME=/usr/local/mpi
          make USE_NVIDIA=1 -j$(nproc)

      - name: Install FlagCX PyTorch Plugin
        run: |
          export PATH=/root/miniconda3/bin:$PATH
          eval "$(/root/miniconda3/bin/conda shell.bash hook)" && conda activate flagscale-train && conda env list
          pip uninstall -y setuptools && pip install setuptools==77.0.1 --extra-index-url https://pypi.org/simple 
          cd /__w/FlagCX/FlagCX/plugin/torch
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          export FLAGCX_ADAPTOR=nvidia
          python3 setup.py build_ext --inplace
          echo "PYTHONPATH=/__w/FlagCX/FlagCX/plugin/torch:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Run PyTorch API Tests
        run: |
          export PATH=/root/miniconda3/bin:$PATH
          eval "$(/root/miniconda3/bin/conda shell.bash hook)" && conda activate flagscale-train && conda env list
          cd /__w/FlagCX/FlagCX/test/script/
          export FLAGCX_DEBUG=TRACE
          export FLAGCX_DEBUG_SUBSYS=ALL
          bash torch_api_test.sh

  torch-api-test-hygon:
    name: torch-api-test (hygon)
    needs: load-hardware-container-configs
    runs-on: [hg-8g-cicd-flagcx]
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: recursive
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run Hygon Torch API tests
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.hygon_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.hygon_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.hygon_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          hygon torch-api

      - name: Cleanup Hygon Torch API container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-torch-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

  torch-api-test-cuda:
    name: torch-api-test (cuda)
    runs-on: [nv-8g-cicd-flagcx]
    container:
      image: harbor.baai.ac.cn/flagos-dev/flagcx:55c5c6f-cuda-dev
      options: >-
        --gpus all
        --shm-size=500g
        --privileged
        --ipc=host
        --ulimit memlock=-1
        --ulimit stack=67108864
        --ulimit nofile=65535:65535
        --user root
    env:
      FLAGCX_ADAPTOR: nvidia
      USE_NVIDIA: "1"
      MPI_HOME: /usr/local/mpi

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/googletest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/json"
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Prepare CUDA environment
        shell: bash
        run: |
          source /__w/FlagCX/FlagCX/.github/scripts/set_env/cuda.sh
          flagcx_ci_configure_suite torch-api
          flagcx_ci_prepare torch-api
          flagcx_ci_validate_rdma torch-api
          echo "PATH=$MPI_HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "MPI_HOME=$MPI_HOME" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/__w/FlagCX/FlagCX/build/lib:$MPI_HOME/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          nvidia-smi

      - name: Build FlagCX
        run: |
          cd /__w/FlagCX/FlagCX
          make USE_NVIDIA=1 -j$(nproc)

      - name: Install FlagCX PyTorch Plugin
        run: |
          export PATH=/root/miniconda3/bin:$PATH
          eval "$(/root/miniconda3/bin/conda shell.bash hook)" && conda activate flagscale-train
          export PYTHON_BIN=/root/miniconda3/envs/flagscale-train/bin/python
          cd /__w/FlagCX/FlagCX/plugin/torch
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          export FLAGCX_ADAPTOR=nvidia
          "$PYTHON_BIN" setup.py build_ext --inplace
          echo "PYTHONPATH=/__w/FlagCX/FlagCX/plugin/torch:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Run PyTorch API Tests
        run: |
          export PATH=/root/miniconda3/bin:$PATH
          eval "$(/root/miniconda3/bin/conda shell.bash hook)" && conda activate flagscale-train
          export PYTHON_BIN=/root/miniconda3/envs/flagscale-train/bin/python
          cd /__w/FlagCX/FlagCX/test/script
          export FLAGCX_ADAPTOR=nvidia
          export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
          export FLAGCX_DEBUG=TRACE
          export FLAGCX_DEBUG_SUBSYS=ALL
          bash torch_api_test.sh

  torch-api-test-metax:
    name: torch-api-test (metax)
    runs-on: [mx-8g-cicd-flagcx]
    container:
      image: harbor.baai.ac.cn/flagos-dev/flagcx:3016346-metax-dev
      options: >-
        --hostname=te-cicd
        --volume /opt/mxdriver:/opt/mxdriver:ro
        --shm-size=500g
        --ipc=host
        --privileged=true
        --ulimit memlock=-1
        --ulimit stack=67108864
        --ulimit nofile=65535:65535
        --user root
        --group-add video
        -e PLATFORM=metax
        -e TORCH_DISTRIBUTED_BACKEND=mccl
        -e LD_LIBRARY_PATH=/opt/mxdriver/lib:/opt/maca/lib:/usr/local/lib:$LD_LIBRARY_PATH
    env:
      FLAGCX_ADAPTOR: metax
      USE_METAX: "1"
      MPI_HOME: /usr/local/mpi
      TORCH_DISTRIBUTED_BACKEND: mccl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Checkout submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/googletest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/json"
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Prepare MetaX environment
        shell: bash
        run: |
          source /__w/FlagCX/FlagCX/.github/scripts/set_env/metax.sh
          flagcx_ci_configure_suite torch-api
          flagcx_ci_prepare torch-api
          flagcx_ci_validate_rdma torch-api
          echo "PATH=/opt/maca/mxgpu_llvm/bin:$MPI_HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "MPI_HOME=$MPI_HOME" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/__w/FlagCX/FlagCX/build/lib:/opt/mxdriver/lib:/opt/maca/lib:/usr/local/lib:$MPI_HOME/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          mx-smi 2>/dev/null || true

      - name: Build FlagCX
        run: |
          cd /__w/FlagCX/FlagCX
          make USE_METAX=1 -j$(nproc)

      - name: Install FlagCX PyTorch Plugin
        run: |
          cd /__w/FlagCX/FlagCX/plugin/torch
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          export FLAGCX_ADAPTOR=metax
          python3 setup.py build_ext --inplace
          echo "PYTHONPATH=/__w/FlagCX/FlagCX/plugin/torch:$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Run PyTorch API Tests
        run: |
          cd /__w/FlagCX/FlagCX/test/script
          export FLAGCX_ADAPTOR=metax
          export CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
          export FLAGCX_DEBUG=TRACE
          export FLAGCX_DEBUG_SUBSYS=ALL
          bash torch_api_test.sh

  torch-api-test-ppu:
    name: torch-api-test (ppu)
    needs: load-hardware-container-configs
    runs-on: [flagcicd-810e]
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: true
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: recursive
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run PPU Torch API tests
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ppu_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ppu_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ppu_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ppu torch-api

      - name: Cleanup PPU Torch API container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-torch-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
