      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-experimental-mthreads-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-ascend:
    if: contains(fromJSON(inputs.platforms), 'ascend')
    name: perf-test (ascend)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.ascend_runs_on) }}
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (ascend) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ascend_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ascend_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ascend_set_env }}
          FLAGCX_CI_IGNORE_TEST: ${{ needs.load-hardware-container-configs.outputs.ascend_ignore_test }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ascend perf

      - name: Cleanup perf-test (ascend) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-ascend-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-kunlunxin:
    if: contains(fromJSON(inputs.platforms), 'kunlunxin')
    name: perf-test (kunlunxin)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.kunlunxin_runs_on) }}
    timeout-minutes: 60
    container:
      image: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_ci_image }}
      options: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_container_options }}
      volumes: ${{ fromJSON(needs.load-hardware-container-configs.outputs.kunlunxin_container_volumes) }}

    steps:
      - name: Trust workspace and submodules for checkout
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/googletest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/json"

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Run perf-test (kunlunxin) in job container
        shell: bash
        env:
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_set_env }}
          FLAGCX_CI_IGNORE_TEST: ${{ needs.load-hardware-container-configs.outputs.kunlunxin_ignore_test }}
        run: |
          set -euo pipefail
          git clean -ffdX
          git submodule foreach --recursive 'git clean -ffdX'
          mkdir -p "$FLAGCX_CI_LOG_DIR"
          bash .github/scripts/ci/run_in_host_network.sh \
            bash .github/scripts/ci/run_hardware_workload.sh kunlunxin perf "$FLAGCX_CI_SET_ENV" '' 2>&1 | tee "$FLAGCX_CI_LOG_DIR/perf.log"

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-kunlunxin-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf_complete:
    name: Validate selected performance jobs
    if: always()
    needs:
      - load-hardware-container-configs
      - perf-test-iluvatar
      - perf-test-experimental-cuda
      - perf-test-hygon
      - perf-test-experimental-hygon
      - perf-test-cuda
      - perf-test-metax
      - perf-test-ppu
      - perf-test-experimental-ppu
      - perf-test-ascend
      - perf-test-kunlunxin
      - perf-test-mthreads
      - perf-test-experimental-mthreads
    runs-on: ubuntu-latest
    env:
      ILUVATAR_RESULT: ${{ needs['perf-test-iluvatar'].result }}
      PLATFORMS: ${{ inputs.platforms }}
      CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
      CUDA_EXPERIMENTAL_RESULT: ${{ needs['perf-test-experimental-cuda'].result }}
      CUDA_RESULT: ${{ needs['perf-test-cuda'].result }}
      HYGON_RESULT: ${{ needs['perf-test-hygon'].result }}
      HYGON_EXPERIMENTAL_RESULT: ${{ needs['perf-test-experimental-hygon'].result }}
      METAX_RESULT: ${{ needs['perf-test-metax'].result }}
      PPU_RESULT: ${{ needs['perf-test-ppu'].result }}
      PPU_EXPERIMENTAL_RESULT: ${{ needs['perf-test-experimental-ppu'].result }}
      KUNLUNXIN_RESULT: ${{ needs['perf-test-kunlunxin'].result }}
      ASCEND_RESULT: ${{ needs['perf-test-ascend'].result }}
      MTHREADS_RESULT: ${{ needs['perf-test-mthreads'].result }}
      MTHREADS_EXPERIMENTAL_RESULT: ${{ needs['perf-test-experimental-mthreads'].result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate selected performance jobs
        run: >-
          bash .github/scripts/ci/check_platform_workflow.sh
          "$PLATFORMS" "$CONFIG_RESULT" "$CUDA_EXPERIMENTAL_RESULT" "$CUDA_RESULT"
          "$HYGON_RESULT" "$HYGON_EXPERIMENTAL_RESULT" "$METAX_RESULT"
          "$PPU_RESULT" "$PPU_EXPERIMENTAL_RESULT" "$ASCEND_RESULT"

      - name: Validate selected KunlunXin performance job
        env:
          PLATFORMS: ${{ inputs.platforms }}
          CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
          KUNLUNXIN_RESULT: ${{ needs['perf-test-kunlunxin'].result }}
        shell: bash
        run: |
          if python3 -c 'import json, os, sys; sys.exit(0 if "kunlunxin" in json.loads(os.environ["PLATFORMS"]) else 1)'; then
            [[ "$CONFIG_RESULT" == success ]] || { echo "KunlunXin configuration loading ended with: $CONFIG_RESULT" >&2; exit 1; }
            [[ "$KUNLUNXIN_RESULT" == success ]] || { echo "KunlunXin performance job ended with: $KUNLUNXIN_RESULT" >&2; exit 1; }
          fi

      - name: Validate selected Mthreads performance jobs
        env:
          PLATFORMS: ${{ inputs.platforms }}
          CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
          MTHREADS_RESULT: ${{ needs['perf-test-mthreads'].result }}
          MTHREADS_EXPERIMENTAL_RESULT: ${{ needs['perf-test-experimental-mthreads'].result }}
        shell: bash
        run: |
          if python3 -c 'import json, os, sys; sys.exit(0 if "mthreads" in json.loads(os.environ["PLATFORMS"]) else 1)'; then
            [[ "$CONFIG_RESULT" == success ]] || { echo "Mthreads configuration loading ended with: $CONFIG_RESULT" >&2; exit 1; }
            [[ "$MTHREADS_RESULT" == success ]] || { echo "Mthreads performance job ended with: $MTHREADS_RESULT" >&2; exit 1; }
            [[ "$MTHREADS_EXPERIMENTAL_RESULT" == success ]] || { echo "MUSA experimental performance job ended with: $MTHREADS_EXPERIMENTAL_RESULT" >&2; exit 1; }
          fi
