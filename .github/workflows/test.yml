          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (iluvatar) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-iluvatar-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.iluvatar_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.iluvatar_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.iluvatar_set_env }}
          FLAGCX_CI_IGNORE_TEST: ${{ needs.load-hardware-container-configs.outputs.iluvatar_ignore_test }}
        run: |
          set -euo pipefail
          mkdir -p "$FLAGCX_CI_LOG_DIR"
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh" \
            iluvatar perf 2>&1 | tee "$FLAGCX_CI_LOG_DIR/iluvatar-perf.log"

      - name: Cleanup perf-test (iluvatar) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-iluvatar-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-iluvatar-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

