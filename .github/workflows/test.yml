name: Perf Tests in Container

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string

env:
  FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
  FLAGCX_CI_TEST_TIMEOUT: 100m
  FLAGCX_CI_MPI_TIMEOUT: 60m

jobs:
  load-hardware-container-configs:
    if: inputs.platforms != '[]'
    name: Load platform container configurations
    runs-on: ubuntu-latest
    outputs:
      cuda_ci_image: ${{ steps.cuda.outputs.ci_image }}
      cuda_docker_args: ${{ steps.cuda.outputs.docker_args }}
      cuda_set_env: ${{ steps.cuda.outputs.set_env }}
      cuda_runs_on: ${{ steps.cuda.outputs.runs_on }}
      metax_ci_image: ${{ steps.metax.outputs.ci_image }}
      metax_docker_args: ${{ steps.metax.outputs.docker_args }}
      metax_set_env: ${{ steps.metax.outputs.set_env }}
      metax_runs_on: ${{ steps.metax.outputs.runs_on }}
      hygon_ci_image: ${{ steps.hygon.outputs.ci_image }}
      hygon_docker_args: ${{ steps.hygon.outputs.docker_args }}
      hygon_set_env: ${{ steps.hygon.outputs.set_env }}
      hygon_runs_on: ${{ steps.hygon.outputs.runs_on }}
      ppu_ci_image: ${{ steps.ppu.outputs.ci_image }}
      ppu_docker_args: ${{ steps.ppu.outputs.docker_args }}
      ppu_set_env: ${{ steps.ppu.outputs.set_env }}
      ppu_runs_on: ${{ steps.ppu.outputs.runs_on }}
      ascend_ci_image: ${{ steps.ascend.outputs.ci_image }}
      ascend_docker_args: ${{ steps.ascend.outputs.docker_args }}
      ascend_set_env: ${{ steps.ascend.outputs.set_env }}
      ascend_runs_on: ${{ steps.ascend.outputs.runs_on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Load CUDA configuration
        id: cuda
        run: ruby .github/scripts/ci/load_platform_config.rb cuda

      - name: Load MetaX configuration
        id: metax
        run: ruby .github/scripts/ci/load_platform_config.rb metax

      - name: Load Hygon configuration
        id: hygon
        run: ruby .github/scripts/ci/load_platform_config.rb hygon

      - name: Load PPU configuration
        id: ppu
        run: ruby .github/scripts/ci/load_platform_config.rb ppu

      - name: Load Ascend configuration
        id: ascend
        run: ruby .github/scripts/ci/load_platform_config.rb ascend

  perf-test:
    if: contains(fromJSON(inputs.platforms), 'cuda')
    name: perf-test
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.cuda_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf_legacy-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.cuda_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.cuda_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.cuda_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          cuda perf-legacy

      - name: Cleanup perf-test container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf_legacy-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-hygon:
    if: contains(fromJSON(inputs.platforms), 'hygon')
    name: perf-test (hygon)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.hygon_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (hygon) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.hygon_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.hygon_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.hygon_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          hygon perf

      - name: Cleanup perf-test (hygon) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-hygon-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-hygon-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-cuda:
    if: contains(fromJSON(inputs.platforms), 'cuda')
    name: perf-test (cuda)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.cuda_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (cuda) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.cuda_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.cuda_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.cuda_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          cuda perf

      - name: Cleanup perf-test (cuda) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-cuda-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-metax:
    if: contains(fromJSON(inputs.platforms), 'metax')
    name: perf-test (metax)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.metax_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (metax) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.metax_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.metax_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.metax_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          metax perf

      - name: Cleanup perf-test (metax) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-metax-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-metax-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-ppu:
    if: contains(fromJSON(inputs.platforms), 'ppu')
    name: perf-test (ppu)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.ppu_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (ppu) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ppu_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ppu_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ppu_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ppu perf

      - name: Cleanup perf-test (ppu) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ppu-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-ppu-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-ascend:
    if: contains(fromJSON(inputs.platforms), 'ascend')
    name: perf-test (ascend)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.ascend_runs_on) }}
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test (ascend) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-perf-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.ascend_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.ascend_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.ascend_set_env }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          ascend perf

      - name: Cleanup perf-test (ascend) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-ascend-perf-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-ascend-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf_complete:
    name: Validate selected performance jobs
    if: always()
    needs:
      - load-hardware-container-configs
      - perf-test
      - perf-test-hygon
      - perf-test-cuda
      - perf-test-metax
      - perf-test-ppu
      - perf-test-ascend
    runs-on: ubuntu-latest
    env:
      PLATFORMS: ${{ inputs.platforms }}
      CONFIG_RESULT: ${{ needs['load-hardware-container-configs'].result }}
      CUDA_BASE_RESULT: ${{ needs['perf-test'].result }}
      CUDA_RESULT: ${{ needs['perf-test-cuda'].result }}
      HYGON_RESULT: ${{ needs['perf-test-hygon'].result }}
      METAX_RESULT: ${{ needs['perf-test-metax'].result }}
      PPU_RESULT: ${{ needs['perf-test-ppu'].result }}
      ASCEND_RESULT: ${{ needs['perf-test-ascend'].result }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate selected performance jobs
        run: >-
          bash .github/scripts/ci/check_platform_workflow.sh
          "$PLATFORMS" "$CONFIG_RESULT" "$CUDA_BASE_RESULT" "$CUDA_RESULT"
          "$HYGON_RESULT" "$METAX_RESULT" "$PPU_RESULT" "$ASCEND_RESULT"
