name: Perf Tests in Container

on:
  workflow_call:
    inputs:
      platforms:
        required: true
        type: string
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string

env:
  FLAGCX_CI_TEST_MAX_ATTEMPTS: 1
  FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
  FLAGCX_CI_TEST_TIMEOUT: 3m
  FLAGCX_CI_MPI_TIMEOUT: 10m

jobs:
  load-hardware-container-configs:
    if: inputs.platforms != '[]'
    name: Load platform container configurations
    runs-on: ubuntu-latest
    outputs:
      cuda_ci_image: ${{ steps.cuda.outputs.ci_image }}
      cuda_docker_args: ${{ steps.cuda.outputs.docker_args }}
      cuda_set_env: ${{ steps.cuda.outputs.set_env }}
      cuda_ignore_test: ${{ steps.cuda.outputs.ignore_test }}
      cuda_runs_on: ${{ steps.cuda.outputs.runs_on }}
      metax_ci_image: ${{ steps.metax.outputs.ci_image }}
      metax_docker_args: ${{ steps.metax.outputs.docker_args }}
      metax_set_env: ${{ steps.metax.outputs.set_env }}
      metax_ignore_test: ${{ steps.metax.outputs.ignore_test }}
      metax_runs_on: ${{ steps.metax.outputs.runs_on }}
      iluvatar_ci_image: ${{ steps.iluvatar.outputs.ci_image }}
      iluvatar_docker_args: ${{ steps.iluvatar.outputs.docker_args }}
      iluvatar_set_env: ${{ steps.iluvatar.outputs.set_env }}
      iluvatar_ignore_test: ${{ steps.iluvatar.outputs.ignore_test }}
      iluvatar_runs_on: ${{ steps.iluvatar.outputs.runs_on }}
      hygon_ci_image: ${{ steps.hygon.outputs.ci_image }}
      hygon_docker_args: ${{ steps.hygon.outputs.docker_args }}
      hygon_set_env: ${{ steps.hygon.outputs.set_env }}
      hygon_ignore_test: ${{ steps.hygon.outputs.ignore_test }}
      hygon_runs_on: ${{ steps.hygon.outputs.runs_on }}
      ppu_ci_image: ${{ steps.ppu.outputs.ci_image }}
      ppu_docker_args: ${{ steps.ppu.outputs.docker_args }}
      ppu_set_env: ${{ steps.ppu.outputs.set_env }}
      ppu_ignore_test: ${{ steps.ppu.outputs.ignore_test }}
      ppu_runs_on: ${{ steps.ppu.outputs.runs_on }}
      mthreads_ci_image: ${{ steps.mthreads.outputs.ci_image }}
      mthreads_docker_args: ${{ steps.mthreads.outputs.docker_args }}
      mthreads_set_env: ${{ steps.mthreads.outputs.set_env }}
      mthreads_ignore_test: ${{ steps.mthreads.outputs.ignore_test }}
      mthreads_runs_on: ${{ steps.mthreads.outputs.runs_on }}
      ascend_ci_image: ${{ steps.ascend.outputs.ci_image }}
      ascend_docker_args: ${{ steps.ascend.outputs.docker_args }}
      ascend_set_env: ${{ steps.ascend.outputs.set_env }}
      ascend_ignore_test: ${{ steps.ascend.outputs.ignore_test }}
      ascend_runs_on: ${{ steps.ascend.outputs.runs_on }}
      kunlunxin_ci_image: ${{ steps.kunlunxin.outputs.ci_image }}
      kunlunxin_docker_args: ${{ steps.kunlunxin.outputs.docker_args }}
      kunlunxin_container_options: ${{ steps.kunlunxin.outputs.container_options }}
      kunlunxin_container_volumes: ${{ steps.kunlunxin.outputs.container_volumes }}
      kunlunxin_set_env: ${{ steps.kunlunxin.outputs.set_env }}
      kunlunxin_ignore_test: ${{ steps.kunlunxin.outputs.ignore_test }}
      kunlunxin_runs_on: ${{ steps.kunlunxin.outputs.runs_on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Load CUDA configuration
        id: cuda
        run: ruby .github/scripts/ci/load_platform_config.rb cuda

      - name: Load MetaX configuration
        id: metax
        run: ruby .github/scripts/ci/load_platform_config.rb metax

      - name: Load Iluvatar configuration
        id: iluvatar
        run: ruby .github/scripts/ci/load_platform_config.rb iluvatar

      - name: Load Hygon configuration
        id: hygon
        run: ruby .github/scripts/ci/load_platform_config.rb hygon

      - name: Load PPU configuration
        id: ppu
        run: ruby .github/scripts/ci/load_platform_config.rb ppu

      - name: Load Mthreads configuration
        id: mthreads
        run: ruby .github/scripts/ci/load_platform_config.rb mthreads

      - name: Load Ascend configuration
        id: ascend
        run: ruby .github/scripts/ci/load_platform_config.rb ascend

      - name: Load KunlunXin configuration
        id: kunlunxin
        run: ruby .github/scripts/ci/load_platform_config.rb kunlunxin

  perf-test-experimental-cuda:
    if: contains(fromJSON(inputs.platforms), 'cuda')
    name: perf-test-experimental (cuda)
    needs: load-hardware-container-configs
    runs-on: ${{ fromJSON(needs.load-hardware-container-configs.outputs.cuda_runs_on) }}
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: false
          persist-credentials: false
          set-safe-directory: true

      - name: Checkout CUDA submodules with retries
        shell: bash
        run: bash .github/scripts/ci/checkout_submodules.sh

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run perf-test-experimental (cuda) in configured container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf_experimental-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load-hardware-container-configs.outputs.cuda_docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load-hardware-container-configs.outputs.cuda_ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load-hardware-container-configs.outputs.cuda_set_env }}
          FLAGCX_CI_IGNORE_TEST: ${{ needs.load-hardware-container-configs.outputs.cuda_ignore_test }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          cuda perf-test-experimental

      - name: Cleanup perf-test-experimental (cuda) container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-cuda-perf_experimental-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-perf-test-experimental-cuda-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  perf-test-iluvatar:
    if: contains(fromJSON(inputs.platforms), 'iluvatar')
    name: perf-test (iluvatar)
    needs: load-hardware-container-configs
