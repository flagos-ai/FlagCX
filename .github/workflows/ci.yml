# Unified CI entry point for FlagCX.
#
# Pipeline:  lint → generate-matrix → platform-pipeline (matrix)
#
# Lint runs the repository's pre-commit hooks (clang-format) on PR/push changes
# and on the complete tree for scheduled/manual events.
#
# Platform discovery reuses platforms.yml's enabled selection, then filters
# PR changes with per-platform paths_watch.  Shared or unknown files and all
# other events run the full enabled matrix.

name: CI

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 CST daily
  push:
    branches: [main, devops]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  pull_request:
    branches: [main, devops]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse the repository's own .pre-commit-config.yaml.  Pull requests and
  # pushes check their event-specific ranges; scheduled and manual runs check
  # the complete tree so a successful job always ran the hooks it reports.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install --quiet pre-commit==4.2.0
      - name: pre-commit (event scope)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags origin "$BASE_REF"
              from_ref="$(git merge-base "origin/$BASE_REF" HEAD)"
              pre-commit run --show-diff-on-failure \
                --from-ref "$from_ref" --to-ref "$HEAD_SHA"
              ;;
            push)
              if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
                  git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                pre-commit run --show-diff-on-failure \
                  --from-ref "$BEFORE_SHA" --to-ref "$HEAD_SHA"
              else
                # New branches and unreachable pre-force-push commits have no
                # usable range; check all files instead of silently skipping.
                pre-commit run --show-diff-on-failure --all-files
              fi
              ;;
            schedule|workflow_dispatch)
              pre-commit run --show-diff-on-failure --all-files
              ;;
            *)
              echo "Unsupported event for lint: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

  generate-matrix:
    name: Generate platform matrix
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install matrix dependencies
        run: pip install --quiet pyyaml==6.0.2
      - name: Compute platform matrix
        id: matrix
        env:
          FLAGCX_CI_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          # Temporarily focus PR #658 on Hygon unit tests while validating LSA VA sizing.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$FLAGCX_CI_PR_NUMBER" == "658" ]]; then
            echo 'platforms=["hygon"]' >> "$GITHUB_OUTPUT"
          else
            python .github/scripts/ci/generate_matrix.py \
              --event-name "$GITHUB_EVENT_NAME" \
              --base-ref  "${{ github.base_ref || 'main' }}" \
              --configs-dir .github/configs \
              >> "$GITHUB_OUTPUT"
          fi

  platform-pipeline:
    name: Platform pipeline (${{ matrix.platform }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.generate-matrix.outputs.platforms) }}
    uses: ./.github/workflows/_platform_pipeline.yml
    with:
      platform: ${{ matrix.platform }}
