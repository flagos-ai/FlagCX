name: Code Format Check

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string

jobs:
  format-check:
    name: code format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Run CI script unit tests
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2 coverage==7.10.7
          python3 -m unittest discover -s test/script -p 'test_*.py'

      - name: Install format dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Run pre-commit and code format checks
        run: bash .github/scripts/ci/format.sh
