name: Common Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        description: Platform configuration name
        required: true
        type: string

jobs:
  load_config:
    name: Load platform configuration
    runs-on: ubuntu-latest
    outputs:
      display_name: ${{ steps.config.outputs.display_name }}
      ci_image: ${{ steps.config.outputs.ci_image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      docker_args: ${{ steps.config.outputs.docker_args }}
      set_env: ${{ steps.config.outputs.set_env }}
      unit_test_suites: ${{ steps.config.outputs.unit_test_suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Load platform configuration
        id: config
        env:
          FLAGCX_CI_PLATFORM: ${{ inputs.platform }}
        run: ruby .github/scripts/ci/load_platform_config.rb "$FLAGCX_CI_PLATFORM"

  unit_test:
    name: ${{ needs.load_config.outputs.display_name }} / ${{ matrix.suite }}
    needs: load_config
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.load_config.outputs.unit_test_suites) }}
    runs-on: ${{ fromJSON(needs.load_config.outputs.runs_on) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Check Docker
        run: docker version

      - name: Run unit-test suite in container
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.platform }}-${{ matrix.suite }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load_config.outputs.docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load_config.outputs.ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load_config.outputs.set_env }}
          FLAGCX_CI_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail

          docker_args=()
          while IFS= read -r argument; do
            if [[ -n "$argument" ]]; then
              docker_args+=("$argument")
            fi
          done <<< "$FLAGCX_CI_DOCKER_ARGS"

          for proxy_var in HTTP_PROXY HTTPS_PROXY NO_PROXY \
                           http_proxy https_proxy no_proxy; do
            if [[ -n "${!proxy_var:-}" ]]; then
              docker_args+=(--env "$proxy_var")
            fi
          done

          docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
          docker pull "$FLAGCX_CI_IMAGE"
          docker run --rm \
            --name "$FLAGCX_CI_CONTAINER_NAME" \
            "${docker_args[@]}" \
            --user=root \
            --volume "$GITHUB_WORKSPACE:/workspace-src:ro" \
            --workdir /workspace \
            --env HOME=/tmp/flagcx-ci-home \
            --env GITHUB_WORKSPACE=/workspace \
            --env GITHUB_ACTIONS=true \
            --env CI=true \
            --env FLAGCX_CI_SET_ENV \
            --env FLAGCX_CI_SUITE \
            --entrypoint=/bin/bash \
            "$FLAGCX_CI_IMAGE" -lc '
              set -euo pipefail
              mkdir -p "$HOME" /workspace
              cp -a /workspace-src/. /workspace/
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/third-party/googletest
              git config --global --add safe.directory /workspace/third-party/json
              bash .github/scripts/ci/run_unit_test.sh \
                "$FLAGCX_CI_SET_ENV" "$FLAGCX_CI_SUITE"
            '

      - name: Clean up unit-test container
        if: ${{ always() }}
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.platform }}-${{ matrix.suite }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true
