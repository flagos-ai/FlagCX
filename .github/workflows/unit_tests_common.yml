name: Common Unit Tests

on:
  workflow_call:
    inputs:
      platform:
        description: Platform configuration name
        required: true
        type: string
      repository:
        description: Repository containing the source under test
        required: false
        type: string
      ref:
        description: Commit under test
        required: false
        type: string
      cpp_coverage:
        description: Build the instrumented C++ coverage variant and run supplemental tests
        required: false
        type: boolean
        default: false

env:
  FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs

jobs:
  load_config:
    name: Load platform configuration
    runs-on: ubuntu-latest
    outputs:
      display_name: ${{ steps.config.outputs.display_name }}
      ci_image: ${{ steps.config.outputs.ci_image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      docker_args: ${{ steps.config.outputs.docker_args }}
      container_options: ${{ steps.config.outputs.container_options }}
      container_volumes: ${{ steps.config.outputs.container_volumes }}
      set_env: ${{ steps.config.outputs.set_env }}
      unit_test_suites: ${{ steps.config.outputs.unit_test_suites }}
      ignore_test: ${{ steps.config.outputs.ignore_test }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Load platform configuration
        id: config
        env:
          FLAGCX_CI_PLATFORM: ${{ inputs.platform }}
        run: ruby .github/scripts/ci/load_platform_config.rb "$FLAGCX_CI_PLATFORM"

  unit_test:
    name: ${{ needs.load_config.outputs.display_name }} / ${{ matrix.suite }}
    needs: load_config
    if: inputs.platform != 'kunlunxin'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.load_config.outputs.unit_test_suites) }}
    runs-on: ${{ fromJSON(needs.load_config.outputs.runs_on) }}
    steps:
      - name: Install Git for repository checkout
        shell: bash
        env:
          FLAGCX_CI_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$FLAGCX_CI_PLATFORM" == "ascend" ]]; then
            git_version=""
            if command -v git >/dev/null 2>&1; then
              git_version="$(git --version | sed -E 's/.* ([0-9]+)\.([0-9]+).*/\1 \2/')"
            fi
          else
            git_version="$(git --version 2>/dev/null | sed -E 's/.* ([0-9]+)\.([0-9]+).*/\1 \2/')"
          fi
          read -r git_major git_minor <<< "$git_version"
          if [[ -z "$git_version" ]] || ((git_major < 2 || (git_major == 2 && git_minor < 18))); then
            if command -v dnf >/dev/null 2>&1; then
              installer=(dnf)
            elif command -v yum >/dev/null 2>&1; then
              installer=(yum)
            else
              echo "Git is missing and no supported package manager is available" >&2
              exit 1
            fi
            if ((EUID == 0)); then
              "${installer[@]}" install -y git
            elif command -v sudo >/dev/null 2>&1; then
              sudo "${installer[@]}" install -y git
            else
              echo "Installing Git requires root or sudo" >&2
              exit 1
            fi
          fi
          git version

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          submodules: ${{ inputs.platform != 'cuda' && 'recursive' || 'false' }}
          persist-credentials: false
          set-safe-directory: true

      - name: Checkout CUDA submodules with retries
        if: inputs.platform == 'cuda'
        shell: bash
        run: bash .github/scripts/ci/checkout_submodules.sh

      - name: Check Docker
        shell: bash
        run: docker version

      - name: Run unit-test suite in container
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.platform }}-${{ matrix.suite }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.load_config.outputs.docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.load_config.outputs.ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.load_config.outputs.set_env }}
          FLAGCX_CI_IGNORE_TEST: ${{ needs.load_config.outputs.ignore_test }}
          FLAGCX_CI_COVERAGE: ${{ inputs.cpp_coverage && '1' || '0' }}
          FLAGCX_CI_CPP_COVERAGE_REPORT: /ci-logs/cpp-coverage/${{ inputs.platform }}/${{ matrix.suite }}
          FLAGCX_CI_TEST_TIMEOUT: ${{ inputs.cpp_coverage && '80m' || '20m' }}
          FLAGCX_CI_MPI_TIMEOUT: ${{ inputs.cpp_coverage && '80m' || '20m' }}
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/ci/run_hardware_container.sh"
          "${{ inputs.platform }}" unittest "${{ matrix.suite }}"

      - name: Cleanup unit-test container
        if: always()
        shell: bash
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-unit-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.platform }}-${{ matrix.suite }}
        run: docker rm --force "$FLAGCX_CI_CONTAINER_NAME" >/dev/null 2>&1 || true

      - name: Upload test attempt logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-unit_test-${{ github.run_attempt }}-${{ inputs.platform }}-${{ matrix.suite }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload C++ coverage report
        if: ${{ always() && inputs.cpp_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-${{ inputs.platform }}-${{ matrix.suite }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/cpp-coverage/${{ inputs.platform }}/${{ matrix.suite }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  kunlunxin_unit_test:
    name: ${{ needs.load_config.outputs.display_name }} / ${{ matrix.suite }}
    needs: load_config
    if: inputs.platform == 'kunlunxin'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: ${{ fromJSON(needs.load_config.outputs.unit_test_suites) }}
    runs-on: ${{ fromJSON(needs.load_config.outputs.runs_on) }}
    container:
      image: ${{ needs.load_config.outputs.ci_image }}
      options: ${{ needs.load_config.outputs.container_options }}
      volumes: ${{ fromJSON(needs.load_config.outputs.container_volumes) }}
    defaults:
      run:
        shell: bash
    env:
      FLAGCX_CI_TEST_TIMEOUT: ${{ inputs.cpp_coverage && '80m' || '20m' }}
      FLAGCX_CI_MPI_TIMEOUT: ${{ inputs.cpp_coverage && '80m' || '20m' }}
      FLAGCX_CI_COVERAGE: ${{ inputs.cpp_coverage && '1' || '0' }}
      FLAGCX_CI_CPP_COVERAGE_REPORT: ${{ github.workspace }}/.ci-logs/cpp-coverage/kunlunxin/${{ matrix.suite }}
      FLAGCX_CI_IGNORE_TEST: ${{ needs.load_config.outputs.ignore_test }}
    steps:
      - name: Trust workspace and submodules for checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/googletest"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/third-party/json"

      - name: Checkout code in job container
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          persist-credentials: false
          set-safe-directory: true

      - name: Clean build artifacts in job container
        run: |
          git clean -ffdX
          git submodule foreach --recursive 'git clean -ffdX'
          mkdir -p "$FLAGCX_CI_LOG_DIR"

      - name: Run unit-test suite in job container
        env:
          FLAGCX_CI_SET_ENV: ${{ needs.load_config.outputs.set_env }}
          FLAGCX_CI_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          bash .github/scripts/ci/run_unit_test.sh \
            "$FLAGCX_CI_SET_ENV" "$FLAGCX_CI_SUITE" 2>&1 \
            | tee "$FLAGCX_CI_LOG_DIR/suite.log"

      - name: Upload unit-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attempts-unit_test-${{ github.run_attempt }}-kunlunxin-${{ matrix.suite }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload C++ coverage report
        if: ${{ always() && inputs.cpp_coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage-kunlunxin-${{ matrix.suite }}
          path: ${{ env.FLAGCX_CI_CPP_COVERAGE_REPORT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
