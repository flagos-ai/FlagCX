name: Iluvatar CoreX Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/ci/probe_iluvatar_device_api.sh
  workflow_dispatch:
    inputs:
      diagnose_device_api:
        description: Compile historical Device API kernels to locate the CoreX regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iluvatar-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iluvatar_unit_tests:
    name: Iluvatar CoreX unit tests
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.diagnose_device_api }}
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: iluvatar

  probe_config:
    name: Load Iluvatar probe configuration
    if: ${{ github.event_name == 'pull_request' || inputs.diagnose_device_api }}
    runs-on: ubuntu-latest
    outputs:
      ci_image: ${{ steps.config.outputs.ci_image }}
      runs_on: ${{ steps.config.outputs.runs_on }}
      docker_args: ${{ steps.config.outputs.docker_args }}
      set_env: ${{ steps.config.outputs.set_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load platform configuration
        id: config
        run: ruby .github/scripts/ci/load_platform_config.rb iluvatar

  device_api_probe:
    name: Locate Iluvatar Device API compile regression
    needs: probe_config
    runs-on: ${{ fromJSON(needs.probe_config.outputs.runs_on) }}
    timeout-minutes: 90
    env:
      FLAGCX_CI_LOG_DIR: ${{ github.workspace }}/.ci-logs
    steps:
      - name: Checkout full history for source comparisons
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Run CoreX compile probes
        env:
          FLAGCX_CI_CONTAINER_NAME: flagcx-iluvatar-probe-${{ github.run_id }}-${{ github.run_attempt }}
          FLAGCX_CI_DOCKER_ARGS: ${{ needs.probe_config.outputs.docker_args }}
          FLAGCX_CI_IMAGE: ${{ needs.probe_config.outputs.ci_image }}
          FLAGCX_CI_SET_ENV: ${{ needs.probe_config.outputs.set_env }}
        run: bash .github/scripts/ci/run_hardware_container.sh iluvatar probe
      - name: Upload probe logs and CoreX reproducers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iluvatar-device-api-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FLAGCX_CI_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
