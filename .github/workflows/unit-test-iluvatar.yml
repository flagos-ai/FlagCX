name: Iluvatar CoreX Unit Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iluvatar-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iluvatar_unit_tests:
    name: Iluvatar CoreX unit tests
    uses: ./.github/workflows/unit_tests_common.yml
    with:
      platform: iluvatar
