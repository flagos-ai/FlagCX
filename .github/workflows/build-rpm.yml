name: Build RPM Packages

# Verifies that the packaging definition still builds and installs. It is
# not a release path: packages published to the FlagOS repositories are
# built and uploaded by flagos-ai/build-infra from a pinned ref, so no tag
# triggers a build here.
on:
  pull_request:
    branches: [ main ]
    # Only what changes the package. flagcx/** is the library source, so
    # leaving it here built a full multi-backend matrix for every source PR;
    # those packages are published nowhere and downloaded by no one. A build
    # can be requested by hand.
    paths:
      - 'packaging/rpm/**'
      - 'packaging/sync-changelog.py'
      - '.github/workflows/build-rpm.yml'
  workflow_dispatch:

jobs:
  # Build on GitHub-hosted runners. The RPMs are produced entirely inside
  # backend-specific Docker images pulled from public registries (nvcr.io,
  # Docker Hub, repos.metax-tech.com), so the build is host-agnostic and needs
  # neither the internal h20 runner nor a real GPU. This keeps PR checks green
  # without depending on the internal network's flaky public egress.
  #
  # tsm, sunrise and du have no vendor base image: they start from the plain
  # openEuler one and fetch their SDK installers from the FlagOS file store,
  # which a hosted runner reaches as well.
  #
  # ascend targets aarch64 (the CANN 910 base image is arm64), so it runs on an
  # arm64 runner; the other targets build x86_64 packages.
  build-rpm-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nvidia
            backend: nvidia
            distro: rocky8
            base_image: nvcr.io/nvidia/cuda
            base_image_version: 12.4.1-devel-rockylinux8
            runner: ubuntu-latest
          - target: nvidia-openeuler2403
            backend: nvidia
            distro: openeuler2403
            base_image: openeuler/cuda
            base_image_version: 13.0.0-oe2403lts
            runner: ubuntu-latest
          - target: nvidia-fedora43
            backend: nvidia
            distro: fedora43
            base_image: fedora
            base_image_version: '43'
            runner: ubuntu-latest
          - target: metax
            backend: metax
            distro: rocky8
            base_image: rockylinux
            base_image_version: '8'
            runner: ubuntu-latest
          - target: ascend
            backend: ascend
            distro: openeuler2403
            base_image: ascendai/cann
            base_image_version: 8.5.0-910-openeuler24.03-py3.11
            runner: ubuntu-24.04-arm
          # These three filter the vendor sonames out of the generated
          # requires, so their packages install in a plain openEuler container
          # and the install can be asserted here; install_image is what asks
          # for it.
          - target: tsm-openeuler2403
            backend: tsm
            distro: openeuler2403
            base_image: openeuler/openeuler
            base_image_version: 24.03-lts
            runner: ubuntu-latest
            install_image: openeuler/openeuler:24.03-lts
          - target: sunrise-openeuler2403
            backend: sunrise
            distro: openeuler2403
            base_image: openeuler/openeuler
            base_image_version: 24.03-lts
            runner: ubuntu-latest
            install_image: openeuler/openeuler:24.03-lts
          - target: du-openeuler2403
            backend: du
            distro: openeuler2403
            base_image: openeuler/openeuler
            base_image_version: 24.03-lts
            runner: ubuntu-latest
            install_image: openeuler/openeuler:24.03-lts
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ${{ matrix.target }} RPM packages
        env:
          RPM_DISTRO: ${{ matrix.distro }}
          BASE_IMAGE: ${{ matrix.base_image }}
        run: ./packaging/rpm/build-flagcx-rpm.sh ${{ matrix.backend }} ${{ matrix.base_image_version }}

      - name: Install ${{ matrix.target }} RPM packages in a clean container
        if: matrix.install_image != ''
        env:
          INSTALL_IMAGE: ${{ matrix.install_image }}
          TARGET: ${{ matrix.target }}
          BACKEND: ${{ matrix.backend }}
        run: |
          docker run --rm \
            -v "${PWD}/rpm-packages/${TARGET}/RPMS:/rpms:ro" \
            -e BACKEND \
            "${INSTALL_IMAGE}" \
            bash -c '
              set -eux
              dnf install -y /rpms/*/libflagcx-"${BACKEND}"-*.rpm
              rpm -q "libflagcx-${BACKEND}" "libflagcx-${BACKEND}-devel"
              test -e /usr/lib64/libflagcx.so
            '

      - name: Upload ${{ matrix.target }} RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: flagcx-${{ matrix.target }}-rpm-packages
          path: rpm-packages/${{ matrix.target }}/**/*.rpm
          retention-days: 7
