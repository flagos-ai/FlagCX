repos:
-   repo: local
    hooks:
      - id: clang-format-dry-run
        name: clang-format-dry-run
        entry: clang-format --dry-run --Werror
        files: \.(cpp|cc|h|hpp)$
        language: python
        additional_dependencies: [clang-format==14.0.6]

-   repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i --style=file
        files: \.(cpp|cc|h|hpp)$
        language: python
        additional_dependencies: [clang-format==14.0.6]

